name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 se queda corto: Vite 8 pide 20.19+
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --quiet

      - name: Build renderer
        run: npm run build

      - name: Smoke test (Electron)
        run: npm run test:e2e

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest and deep-translator
        run: python -m pip install --upgrade pip pytest deep-translator

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
